name: check action
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows and action.yml
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  e2e:
    name: e2e (${{ matrix.package_manager }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_manager: poetry
            directory: tests/fixture/poetry
            # Deliberately different from the updater's own pinned 3.14
            # interpreter (see action.yml), to prove the project venv is
            # wired up to the requested python-version and not the
            # updater's.
            python_version: '3.12'
            test_command: 'poetry run python check.py'
            venv_python_command: 'poetry run python --version'
          - package_manager: uv
            directory: tests/fixture/uv
            python_version: '3.13'
            test_command: 'uv run python check.py'
            venv_python_command: 'uv run python --version'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action against fixture project (dry-run)
        id: update
        uses: ./
        with:
          python-version: ${{ matrix.python_version }}
          package-manager: ${{ matrix.package_manager }}
          directory: ${{ matrix.directory }}
          test-command: ${{ matrix.test_command }}
          dry-run: 'true'
          github_token: ${{ github.token }}

      - name: Assert reported outputs
        env:
          PASSED: ${{ steps.update.outputs.passed-packages }}
          FAILED: ${{ steps.update.outputs.failed-packages }}
          SKIPPED: ${{ steps.update.outputs.skipped-packages }}
        run: |
          status=0

          if [ "$PASSED" != "six" ]; then
            echo "expected passed-packages=six, got '$PASSED'"
            status=1
          fi

          if [ "$FAILED" != "idna" ]; then
            echo "expected failed-packages=idna, got '$FAILED'"
            status=1
          fi

          if [ -n "$SKIPPED" ]; then
            echo "expected skipped-packages to be empty, got '$SKIPPED'"
            status=1
          fi

          exit $status

      - name: Assert report-json shape
        env:
          REPORT_JSON: ${{ steps.update.outputs.report-json }}
        run: python3 .github/scripts/assert_report_json.py

      - name: Verify the fixture environment is healthy after the run
        working-directory: ${{ matrix.directory }}
        env:
          TEST_COMMAND: ${{ matrix.test_command }}
        run: $TEST_COMMAND

      - name: Verify the project venv really runs the requested python-version
        working-directory: ${{ matrix.directory }}
        env:
          VENV_PYTHON_COMMAND: ${{ matrix.venv_python_command }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          actual="$($VENV_PYTHON_COMMAND)"
          echo "project venv reports: $actual"
          case "$actual" in
            "Python $PYTHON_VERSION"*) ;;
            *)
              echo "expected project venv python to start with 'Python $PYTHON_VERSION', got '$actual'"
              exit 1
              ;;
          esac

      - name: Verify no unexpected working tree changes
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "unexpected working tree changes after a dry-run:"
            echo "$changes"
            exit 1
          fi
