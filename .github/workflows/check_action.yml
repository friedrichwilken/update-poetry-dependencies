name: check action
on:
  pull_request:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows and action.yml
        uses: raven-actions/actionlint@v2

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_manager: poetry
            directory: tests/fixture/poetry
            # Deliberately different from the updater's own pinned 3.14
            # interpreter (see action.yml), to prove the project venv is
            # wired up to the requested python-version and not the
            # updater's.
            python_version: '3.12'
            test_command: 'poetry run python check.py'
            venv_python_command: 'poetry run python --version'
          - package_manager: uv
            directory: tests/fixture/uv
            python_version: '3.13'
            test_command: 'uv run python check.py'
            venv_python_command: 'uv run python --version'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run action against fixture project (dry-run)
        id: update
        uses: ./
        with:
          python-version: ${{ matrix.python_version }}
          package-manager: ${{ matrix.package_manager }}
          directory: ${{ matrix.directory }}
          test-command: ${{ matrix.test_command }}
          dry-run: 'true'
          github_token: ${{ github.token }}

      - name: Assert reported outputs
        env:
          PASSED: ${{ steps.update.outputs.passed-packages }}
          FAILED: ${{ steps.update.outputs.failed-packages }}
          SKIPPED: ${{ steps.update.outputs.skipped-packages }}
        run: |
          status=0

          if [ "$PASSED" != "six" ]; then
            echo "expected passed-packages=six, got '$PASSED'"
            status=1
          fi

          if [ "$FAILED" != "idna" ]; then
            echo "expected failed-packages=idna, got '$FAILED'"
            status=1
          fi

          if [ -n "$SKIPPED" ]; then
            echo "expected skipped-packages to be empty, got '$SKIPPED'"
            status=1
          fi

          exit $status

      - name: Verify the fixture environment is healthy after the run
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.test_command }}

      - name: Debug environment (temporary diagnostics)
        working-directory: ${{ matrix.directory }}
        run: |
          echo "PATH=$PATH"
          echo "POETRY_VIRTUALENVS_IN_PROJECT=$POETRY_VIRTUALENVS_IN_PROJECT"
          which -a poetry || true
          which -a uv || true
          if [ -e .venv/bin/python ]; then
            readlink -f .venv/bin/python || true
            .venv/bin/python --version || true
            cat .venv/pyvenv.cfg || true
          fi
          if command -v poetry >/dev/null 2>&1; then
            poetry env info || true
          fi

      - name: Verify the project venv really runs the requested python-version
        working-directory: ${{ matrix.directory }}
        run: |
          actual="$(${{ matrix.venv_python_command }})"
          echo "project venv reports: $actual"
          case "$actual" in
            "Python ${{ matrix.python_version }}"*) ;;
            *)
              echo "expected project venv python to start with 'Python ${{ matrix.python_version }}', got '$actual'"
              exit 1
              ;;
          esac

      - name: Verify no unexpected working tree changes
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "unexpected working tree changes after a dry-run:"
            echo "$changes"
            exit 1
          fi
