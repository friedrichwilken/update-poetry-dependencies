name: check action
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows and action.yml
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install dev dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  e2e:
    name: e2e (${{ matrix.package_manager }}${{ matrix.name_suffix }})
    permissions:
      contents: read
      # Only the "basic" matrix entries below actually turn create-issues
      # on, and dry-run never writes anything either way - but the token
      # still needs read access for the `gh issue list` lookup that plans
      # its actions (see updater/github_issues.py).
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_manager: poetry
            name_suffix: ''
            directory: tests/fixture/poetry
            # Deliberately different from the updater's own pinned 3.14
            # interpreter (see action.yml), to prove the project venv is
            # wired up to the requested python-version and not the
            # updater's.
            python_version: '3.12'
            test_command: 'poetry run python check.py'
            venv_python_command: 'poetry run python --version'
            allow_major: 'false'
            # One matrix entry per backend also exercises create-issues -
            # see the "Assert issue-actions output" step below. dry-run
            # means this never actually writes to GitHub (see the
            # "create-issues" README section).
            create_issues: 'true'
            strategy: 'per-package'
            update_transitive: 'false'
            without_groups: ''
            scenario: basic
          - package_manager: uv
            name_suffix: ''
            directory: tests/fixture/uv
            python_version: '3.13'
            test_command: 'uv run python check.py'
            venv_python_command: 'uv run python --version'
            allow_major: 'false'
            create_issues: 'true'
            strategy: 'per-package'
            update_transitive: 'false'
            without_groups: ''
            scenario: basic
          - package_manager: poetry
            name_suffix: ', major'
            directory: tests/fixture/poetry-major
            python_version: '3.12'
            test_command: 'poetry run python check.py'
            venv_python_command: 'poetry run python --version'
            allow_major: 'true'
            create_issues: 'false'
            strategy: 'per-package'
            update_transitive: 'false'
            without_groups: ''
            scenario: major
          - package_manager: uv
            name_suffix: ', major'
            directory: tests/fixture/uv-major
            python_version: '3.13'
            test_command: 'uv run python check.py'
            venv_python_command: 'uv run python --version'
            allow_major: 'true'
            create_issues: 'false'
            strategy: 'per-package'
            update_transitive: 'false'
            without_groups: ''
            scenario: major
          # strategy: batch-first (issue #23) - two families of entries:
          # "batch" reuses the basic fixtures, whose idna update
          # deliberately fails the test command, so the batch as a whole
          # fails and falls back to the per-package loop - same final
          # outcome as the plain "basic" entries above (idna failed, six
          # updated), but report-json must show batch_test_failed: true.
          # "batch happy" uses a dedicated fixture where every package
          # updates cleanly, to exercise (and count) the actual happy
          # path - see the "Assert exactly one test run" step below.
          - package_manager: poetry
            name_suffix: ', batch'
            directory: tests/fixture/poetry
            python_version: '3.12'
            test_command: 'poetry run python check.py'
            venv_python_command: 'poetry run python --version'
            allow_major: 'false'
            create_issues: 'false'
            strategy: 'batch-first'
            update_transitive: 'false'
            without_groups: ''
            scenario: batch-fallback
          - package_manager: uv
            name_suffix: ', batch'
            directory: tests/fixture/uv
            python_version: '3.13'
            test_command: 'uv run python check.py'
            venv_python_command: 'uv run python --version'
            allow_major: 'false'
            create_issues: 'false'
            strategy: 'batch-first'
            update_transitive: 'false'
            without_groups: ''
            scenario: batch-fallback
          - package_manager: poetry
            name_suffix: ', batch happy'
            directory: tests/fixture/poetry-batch
            python_version: '3.12'
            test_command: 'poetry run python check.py'
            venv_python_command: 'poetry run python --version'
            allow_major: 'false'
            create_issues: 'false'
            strategy: 'batch-first'
            update_transitive: 'true'
            without_groups: ''
            scenario: batch-happy
          - package_manager: uv
            name_suffix: ', batch happy'
            directory: tests/fixture/uv-batch
            python_version: '3.13'
            test_command: 'uv run python check.py'
            venv_python_command: 'uv run python --version'
            allow_major: 'false'
            create_issues: 'false'
            strategy: 'batch-first'
            update_transitive: 'true'
            without_groups: ''
            scenario: batch-happy
          # Dependency group selection (issue #4): reuses the batch
          # fixtures (they already carry a "dev" group with one
          # exactly-pinned member, typing-extensions - see their
          # pyproject.toml) with without-groups: dev, and asserts that
          # typing-extensions never shows up in report-json at all while
          # idna/six (the "main" group) are unaffected.
          - package_manager: poetry
            name_suffix: ', groups'
            directory: tests/fixture/poetry-batch
            python_version: '3.12'
            test_command: 'poetry run python check.py'
            venv_python_command: 'poetry run python --version'
            allow_major: 'false'
            create_issues: 'false'
            strategy: 'per-package'
            update_transitive: 'false'
            without_groups: 'dev'
            scenario: groups
          - package_manager: uv
            name_suffix: ', groups'
            directory: tests/fixture/uv-batch
            python_version: '3.13'
            test_command: 'uv run python check.py'
            venv_python_command: 'uv run python --version'
            allow_major: 'false'
            create_issues: 'false'
            strategy: 'per-package'
            update_transitive: 'false'
            without_groups: 'dev'
            scenario: groups
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action against fixture project (dry-run)
        id: update
        uses: ./
        with:
          python-version: ${{ matrix.python_version }}
          package-manager: ${{ matrix.package_manager }}
          directory: ${{ matrix.directory }}
          test-command: ${{ matrix.test_command }}
          allow-major: ${{ matrix.allow_major }}
          create-issues: ${{ matrix.create_issues }}
          strategy: ${{ matrix.strategy }}
          update-transitive: ${{ matrix.update_transitive }}
          without-groups: ${{ matrix.without_groups }}
          dry-run: 'true'
          github_token: ${{ github.token }}

      - name: Assert reported outputs (basic scenario)
        # batch-fallback (strategy: batch-first, using the basic fixtures)
        # must reproduce the exact same final outcome as plain per-package -
        # idna's own update fails the test either way, so the batch as a
        # whole fails and falls back to the per-package loop.
        if: matrix.scenario == 'basic' || matrix.scenario == 'batch-fallback'
        env:
          PASSED: ${{ steps.update.outputs.passed-packages }}
          FAILED: ${{ steps.update.outputs.failed-packages }}
          SKIPPED: ${{ steps.update.outputs.skipped-packages }}
          HELD_BACK: ${{ steps.update.outputs.held-back-packages }}
        run: |
          status=0

          if [ "$PASSED" != "six" ]; then
            echo "expected passed-packages=six, got '$PASSED'"
            status=1
          fi

          if [ "$FAILED" != "idna" ]; then
            echo "expected failed-packages=idna, got '$FAILED'"
            status=1
          fi

          if [ -n "$SKIPPED" ]; then
            echo "expected skipped-packages to be empty, got '$SKIPPED'"
            status=1
          fi

          if [ -n "$HELD_BACK" ]; then
            echo "expected held-back-packages to be empty, got '$HELD_BACK'"
            status=1
          fi

          exit $status

      - name: Assert issue-actions output (basic scenario, create-issues)
        if: matrix.scenario == 'basic'
        env:
          ISSUE_ACTIONS: ${{ steps.update.outputs.issue-actions }}
        run: |
          status=0

          echo "issue-actions: $ISSUE_ACTIONS"

          case "$ISSUE_ACTIONS" in
            *'{"package":"idna","action":"create","issue":null}'*) ;;
            *)
              echo "expected issue-actions to contain a create action for idna, got '$ISSUE_ACTIONS'"
              status=1
              ;;
          esac

          case "$ISSUE_ACTIONS" in
            *'"package":"six"'*)
              echo "expected no issue-actions entry for six (it updated cleanly), got '$ISSUE_ACTIONS'"
              status=1
              ;;
          esac

          exit $status

      - name: Assert reported outputs (major scenario)
        if: matrix.scenario == 'major'
        env:
          PASSED: ${{ steps.update.outputs.passed-packages }}
          FAILED: ${{ steps.update.outputs.failed-packages }}
          SKIPPED: ${{ steps.update.outputs.skipped-packages }}
          HELD_BACK: ${{ steps.update.outputs.held-back-packages }}
        run: |
          status=0

          if [ "$PASSED" != "charset-normalizer,zipp" ]; then
            echo "expected passed-packages=charset-normalizer,zipp, got '$PASSED'"
            status=1
          fi

          if [ -n "$FAILED" ]; then
            echo "expected failed-packages to be empty, got '$FAILED'"
            status=1
          fi

          if [ -n "$SKIPPED" ]; then
            echo "expected skipped-packages to be empty, got '$SKIPPED'"
            status=1
          fi

          if [ "$HELD_BACK" != "charset-normalizer" ]; then
            echo "expected held-back-packages=charset-normalizer, got '$HELD_BACK'"
            status=1
          fi

          exit $status

      - name: Assert reported outputs (groups scenario)
        # without-groups: dev must exclude typing-extensions from being
        # iterated at all - idna/six (the "main" group) are unaffected.
        if: matrix.scenario == 'groups'
        env:
          PASSED: ${{ steps.update.outputs.passed-packages }}
          FAILED: ${{ steps.update.outputs.failed-packages }}
          SKIPPED: ${{ steps.update.outputs.skipped-packages }}
          REPORT_JSON: ${{ steps.update.outputs.report-json }}
        run: |
          status=0

          if [ "$PASSED" != "idna,six" ]; then
            echo "expected passed-packages=idna,six, got '$PASSED'"
            status=1
          fi

          if [ -n "$FAILED" ]; then
            echo "expected failed-packages to be empty, got '$FAILED'"
            status=1
          fi

          if [ -n "$SKIPPED" ]; then
            echo "expected skipped-packages to be empty, got '$SKIPPED'"
            status=1
          fi

          case "$REPORT_JSON" in
            *typing-extensions*)
              echo "expected typing-extensions to be excluded entirely by without-groups: dev, got '$REPORT_JSON'"
              status=1
              ;;
          esac

          exit $status

      - name: Assert report-json shape
        env:
          REPORT_JSON: ${{ steps.update.outputs.report-json }}
          TRANSITIVE_REPORT: ${{ steps.update.outputs.transitive-report }}
          SCENARIO: ${{ matrix.scenario }}
        run: python3 .github/scripts/assert_report_json.py

      - name: Assert manifest changes match the major-bump scenario
        if: matrix.scenario == 'major'
        working-directory: ${{ matrix.directory }}
        run: |
          status=0

          # zipp's major bump must have raised its declared constraint -
          # the original capped upper bound (<4.0) must be gone, whether
          # the backend rewrote the whole constraint (Poetry) or only
          # dropped the upper bound while keeping the lower one (uv).
          zipp_line="$(grep -i zipp pyproject.toml)"
          echo "zipp line: $zipp_line"
          case "$zipp_line" in
            *'<4.0'*)
              echo "expected zipp's original capped upper bound (<4.0) to be gone"
              status=1
              ;;
          esac

          # charset-normalizer's held-back major bump must leave its
          # manifest constraint byte-identical - only the lock file (the
          # in-range fallback) may have changed for it.
          cn_line="$(grep -i charset-normalizer pyproject.toml)"
          echo "charset-normalizer line: $cn_line"
          case "$cn_line" in
            *'2.0.0'*'3.0'*) ;;
            *)
              echo "expected charset-normalizer's original constraint (>=2.0.0,<3.0) to be unchanged"
              status=1
              ;;
          esac

          exit $status

      - name: Assert exactly one test run (batch happy-path scenario)
        # Must run before "Verify the fixture environment is healthy" below,
        # which deliberately re-runs the test command once more itself and
        # would otherwise inflate this count - both fixtures' check.py
        # appends one line to test_runs.log per invocation (see
        # tests/fixture/{uv,poetry}-batch/check.py). Every package in these
        # fixtures updates cleanly, so strategy: batch-first's happy path
        # should have tested the whole batch exactly once.
        if: matrix.scenario == 'batch-happy'
        working-directory: ${{ matrix.directory }}
        run: |
          status=0
          runs="$(wc -l < test_runs.log | tr -d ' ')"
          echo "test command ran $runs time(s)"
          if [ "$runs" != "1" ]; then
            echo "expected the test command to run exactly once, ran $runs times"
            status=1
          fi
          exit $status

      - name: Verify the fixture environment is healthy after the run
        working-directory: ${{ matrix.directory }}
        env:
          TEST_COMMAND: ${{ matrix.test_command }}
        run: $TEST_COMMAND

      - name: Verify the project venv really runs the requested python-version
        working-directory: ${{ matrix.directory }}
        env:
          VENV_PYTHON_COMMAND: ${{ matrix.venv_python_command }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          actual="$($VENV_PYTHON_COMMAND)"
          echo "project venv reports: $actual"
          case "$actual" in
            "Python $PYTHON_VERSION"*) ;;
            *)
              echo "expected project venv python to start with 'Python $PYTHON_VERSION', got '$actual'"
              exit 1
              ;;
          esac

      - name: Verify no unexpected working tree changes
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "unexpected working tree changes after a dry-run:"
            echo "$changes"
            exit 1
          fi
