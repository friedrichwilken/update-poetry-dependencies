name: check action
on:
  pull_request:
    branches: [main]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint `action.yml`
        uses: raven-actions/actionlint@v2
        with:
          files: "action.yml"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run action against fixture project (dry-run)
        id: update
        uses: ./
        with:
          directory: tests/fixture/poetry
          test-command: 'poetry run python check.py'
          dry-run: 'true'
          github_token: ${{ github.token }}

      - name: Assert reported outputs
        env:
          PASSED: ${{ steps.update.outputs.passed-packages }}
          FAILED: ${{ steps.update.outputs.failed-packages }}
          SKIPPED: ${{ steps.update.outputs.skipped-packages }}
        run: |
          status=0

          if [ "$PASSED" != "six" ]; then
            echo "expected passed-packages=six, got '$PASSED'"
            status=1
          fi

          if [ "$FAILED" != "idna" ]; then
            echo "expected failed-packages=idna, got '$FAILED'"
            status=1
          fi

          if [ -n "$SKIPPED" ]; then
            echo "expected skipped-packages to be empty, got '$SKIPPED'"
            status=1
          fi

          exit $status
