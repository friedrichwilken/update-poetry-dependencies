name: release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute major version tag
        id: major
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          major="${REF_NAME%%.*}"
          echo "tag=$major" >> "$GITHUB_OUTPUT"

      - name: Force-move the major tag to this release
        env:
          MAJOR_TAG: ${{ steps.major.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR_TAG" "$REF_NAME"
          git push origin "$MAJOR_TAG" --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create "$REF_NAME" --title "$REF_NAME" --generate-notes
