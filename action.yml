name: 'Test-gated Python updates'
description: 'Updates your Poetry or uv dependencies one top-level package at a time, testing each update, and creates a pull request with the results.'
author: 'Friedrich Wilken'
branding:
  icon: 'refresh-cw'
  color: 'blue'
inputs:
  python-version:
    description: "The Python version to use for the project."
    default: '3.12.14'
  package-manager:
    description: "Which package manager the project uses: 'auto' (detected from the lock file present in `directory`), 'poetry', or 'uv'."
    default: 'auto'
  poetry-version:
    description: "The Poetry version to use. Only used when the poetry backend is selected."
    default: '2.4.3'
  uv-sync-args:
    description: "Only used when the uv backend is selected. Overrides the default `--all-groups --all-extras` group/extra selection passed to `uv sync` (parsed as shell arguments, e.g. '--extra cpu --group dev'). Needed when the project declares `tool.uv.conflicts`, since `--all-groups --all-extras` would otherwise try to select mutually exclusive extras/groups and `uv sync` would fail outright."
    default: ''
  directory:
    description: "The directory of the project files."
    default: './'
  pr-title-prefix:
    description: 'A prefix that gets prepended to the PR title.'
    default: ''
  pr-labels:
    description: 'A comma or newline separated list of labels added to the PR.'
    default: ''
  test-command:
    description: 'A command for a test to run after updating every package.'
    default: ''
  branch-name:
    description: 'Fixed branch name used for the update PR. Reused (and force-pushed) on every run instead of creating a new PR each time.'
    default: 'deps/test-gated-updates'
  base-branch:
    description: 'Base branch for the PR. Defaults to the branch that is currently checked out.'
    default: ''
  dry-run:
    description: 'Run the full update loop but skip pushing the branch and creating/updating the PR.'
    default: 'false'
  allow-major:
    description: "Opt-in: for each package whose declared constraint would exclude its latest release, also attempt an update beyond the declared constraint (usually, but not always, a new major version) before falling back to the plain in-range update on failure. See docs/manual/allow-major.md."
    default: 'false'
  strategy:
    description: "'per-package' (default): update, test and commit one top-level package at a time. 'batch-first': update every package at once and test once; on success, replay the same result as per-package commits (no extra test runs); on failure, fall back to the per-package loop. Cuts test runs from N down to close to 1 in the happy path. See docs/manual/strategies.md."
    default: 'per-package'
  create-issues:
    description: "Opt-in: file one GitHub issue per top-level package that fails (or has a held-back beyond-constraint attempt), updated across runs and closed automatically once it no longer applies. Requires `issues: write` on the token. See docs/manual/create-issues.md."
    default: 'false'
  issue-labels:
    description: 'A comma or newline separated list of labels added to an issue created by create-issues. Labels must already exist in the repository.'
    default: ''
  update-transitive:
    description: "Opt-in: after the top-level loop (and any allow-major beyond-constraint attempts) finish, run one final tested step that refreshes every dependency - transitive included - still updatable within its existing constraints (`poetry update --lock` / `uv lock --upgrade`, then a sync), committed separately as 'Update transitive dependencies'. See docs/manual/update-transitive.md."
    default: 'false'
  with-groups:
    description: "A comma or newline separated list of dependency groups to additionally include when selecting what gets installed/synced (Poetry: its own optional groups; uv: additional groups on top of its own default selection - see docs/manual/dependency-groups.md for why this has no effect on which top-level packages are iterated). 'main' names the project's own ungrouped dependencies. May be combined with without-groups; mutually exclusive with only-groups."
    default: ''
  without-groups:
    description: "A comma or newline separated list of dependency groups to exclude. 'main' names the project's own ungrouped dependencies ('dev' additionally covers uv's legacy tool.uv.dev-dependencies). May be combined with with-groups; mutually exclusive with only-groups. See docs/manual/dependency-groups.md."
    default: ''
  only-groups:
    description: "A comma or newline separated list of dependency groups to exclusively include, dropping every other group ('main' included). Mutually exclusive with with-groups/without-groups. See docs/manual/dependency-groups.md."
    default: ''
  github_token:
    description: 'GitHub token for the PR creation.'
    required: true

outputs:
  passed-packages:
    description: 'Comma separated list of packages that were updated and passed the test command.'
    value: ${{ steps.update.outputs.passed-packages }}
  failed-packages:
    description: 'Comma separated list of packages whose update or test failed and were discarded.'
    value: ${{ steps.update.outputs.failed-packages }}
  skipped-packages:
    description: 'Comma separated list of packages that had nothing to update.'
    value: ${{ steps.update.outputs.skipped-packages }}
  held-back-packages:
    description: "Comma separated list of packages where an update beyond the declared constraint was attempted (allow-major) but held back - the package may still show up in passed-packages/failed-packages/skipped-packages for the in-range update that ran instead; see report-json's beyond_constraint_* fields for details."
    value: ${{ steps.update.outputs.held-back-packages }}
  pr-body:
    description: 'The rendered report / PR body.'
    value: ${{ steps.update.outputs.pr-body }}
  report-json:
    description: 'JSON array of per-package update records, one object per top-level package: {name, status, old_version, new_version, failure_kind, output_tail}, plus additive fields when allow-major is used: {bump, constraint_raised, beyond_constraint_version, beyond_constraint_failure_kind, beyond_constraint_output_tail, beyond_constraint_skip_reason}, and when strategy is batch-first: {strategy, tested_in_batch, batch_test_failed, bundled_with}. status is one of "updated", "failed", "skipped"; failure_kind is "resolution", "test", or null; bump (only on an "updated" outcome, when allow-major is used) is the actual release segment that changed: "major", "minor", "patch", or "other".'
    value: ${{ steps.update.outputs.report-json }}
  issue-actions:
    description: 'JSON array of planned/performed create-issues actions, one object per affected package: {package, action, issue}. action is "create", "update", or "close"; issue is the existing/created issue number, or null for a not-yet-created issue (always null in dry-run, since nothing is created). Empty array ([]) when create-issues is not enabled.'
    value: ${{ steps.update.outputs.issue-actions }}
  transitive-report:
    description: 'A single JSON object reporting the update-transitive step (or the JSON literal null when update-transitive is not enabled, or the step never ran because the run aborted first): {status, changed_packages, failure_kind, output_tail}. status is "updated", "failed", or "unchanged"; changed_packages is an array of {name, old, new} for every package the lock-wide refresh changed (present even on a failed/discarded attempt, to show what would have changed); failure_kind ("resolution" or "test") and output_tail are only present when status is "failed". See docs/manual/update-transitive.md.'
    value: ${{ steps.update.outputs.transitive-report }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

    - name: Update and test packages
      id: update
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        POETRY_VERSION: ${{ inputs.poetry-version }}
        UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        DIRECTORY: ${{ inputs.directory }}
        PR_TITLE_PREFIX: ${{ inputs.pr-title-prefix }}
        PR_LABELS: ${{ inputs.pr-labels }}
        TEST_COMMAND: ${{ inputs.test-command }}
        BRANCH_NAME: ${{ inputs.branch-name }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        DRY_RUN: ${{ inputs.dry-run }}
        ALLOW_MAJOR: ${{ inputs.allow-major }}
        STRATEGY: ${{ inputs.strategy }}
        CREATE_ISSUES: ${{ inputs.create-issues }}
        ISSUE_LABELS: ${{ inputs.issue-labels }}
        UPDATE_TRANSITIVE: ${{ inputs.update-transitive }}
        WITH_GROUPS: ${{ inputs.with-groups }}
        WITHOUT_GROUPS: ${{ inputs.without-groups }}
        ONLY_GROUPS: ${{ inputs.only-groups }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # The updater itself always runs on a fixed, pinned interpreter
        # (independent of the project's own python-version input) so that
        # e.g. tomllib is always available; --no-project keeps `uv run`
        # from trying to discover/sync the caller's checked-out project as
        # if it were the updater's own project. All the branching between
        # backends (which interpreter/tools to provision for the project)
        # happens in Python - see updater/bootstrap.py.
        PYTHONPATH="$GITHUB_ACTION_PATH" uv run --no-project --python 3.14 -m updater
